# CODEX: 21 linhas alteradas; avaliação, embarque e cancelamentos. Remover após validação.
services:
    # Dependencias em disco Linux evitam milhares de leituras pelo bind mount do Windows.
    composer:
        build:
            context: ./docker/8.5-nginx
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                TIMEZONE: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
        image: 'sail-8.5/app'
        entrypoint: ['/bin/bash', '-ec']
        command:
            - |
                composer install --no-interaction --prefer-dist
                chown -R "${WWWUSER:-1000}:${WWWGROUP:-1000}" vendor bootstrap/cache
        environment:
            COMPOSER_ALLOW_SUPERUSER: '1'
            WWWUSER: '${WWWUSER}'
            WWWGROUP: '${WWWGROUP}'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail
    laravel.test:
        build:
            context: ./docker/8.5-nginx
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                TIMEZONE: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        dns:
            - '1.1.1.1'
            - '8.8.8.8'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${REVERB_SERVER_PORT:-8080}:8080'
        environment:
            TZ: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            composer:
                condition: service_completed_successfully
            mysql:
                condition: service_started
            valkey:
                condition: service_started
            rustfs:
                condition: service_started
            mailpit:
                condition: service_started
    scheduler:
        build:
            context: ./docker/8.5-nginx
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                TIMEZONE: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
        image: 'sail-8.5/app'
        command: php artisan schedule:work
        environment:
            TZ: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        dns:
            - '1.1.1.1'
            - '8.8.8.8'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            composer:
                condition: service_completed_successfully
            mysql:
                condition: service_started
            valkey:
                condition: service_started
    # push dos apps (Firebase): fila própria, para uma chamada lenta ao FCM
    # não atrasar a fila broadcasts do tempo real
    queue-push:
        build:
            context: ./docker/8.5-nginx
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                TIMEZONE: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
        image: 'sail-8.5/app'
        command: php artisan queue:work --queue=push --tries=3 --sleep=1 --timeout=60
        restart: unless-stopped
        environment:
            TZ: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        dns:
            - '1.1.1.1'
            - '8.8.8.8'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            composer:
                condition: service_completed_successfully
            mysql:
                condition: service_started
            valkey:
                condition: service_started
    # tempo real (Reverb): entrega os eventos da fila broadcasts (chat, corrida,
    # chamadas). Sem ele os apps só recebem pela consulta periódica
    queue-broadcasts:
        build:
            context: ./docker/8.5-nginx
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                TIMEZONE: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
        image: 'sail-8.5/app'
        command: php artisan queue:work --queue=broadcasts --tries=3 --sleep=1 --timeout=60
        restart: unless-stopped
        environment:
            TZ: '${CONTAINER_TIMEZONE:-America/Porto_Velho}'
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            # o Reverb roda no container laravel.test, não neste
            REVERB_HOST: laravel.test
        dns:
            - '1.1.1.1'
            - '8.8.8.8'
        volumes:
            - '.:/var/www/html'
            - 'sail-vendor:/var/www/html/vendor'
        networks:
            - sail
        depends_on:
            composer:
                condition: service_completed_successfully
            mysql:
                condition: service_started
            valkey:
                condition: service_started
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    valkey:
        image: 'valkey/valkey:alpine'
        ports:
            - '${FORWARD_VALKEY_PORT:-6379}:6379'
        volumes:
            - 'sail-valkey:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - valkey-cli
                - ping
            retries: 3
            timeout: 5s
    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_EXTERNAL_ADDRESS: ':9000'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_ACCESS_KEY: sail
            RUSTFS_SECRET_KEY: password
            RUSTFS_LOG_LEVEL: info
        volumes:
            - 'sail-rustfs:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - sh
                - '-c'
                - 'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health'
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-valkey:
        driver: local
    sail-rustfs:
        driver: local
    sail-vendor:
        driver: local
